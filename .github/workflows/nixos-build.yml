name: Build NixOS

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nixos-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build nixosConfiguration
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            max-jobs = auto
            cores = 0
            keep-outputs = false
            keep-derivations = false

      - name: Evaluate NixOS configuration
        run: nix eval --raw .#nixosConfigurations.nixos.config.system.build.toplevel.drvPath

      - name: Build NixOS system
        run: nix build --no-link --print-build-logs .#nixosConfigurations.nixos.config.system.build.toplevel

      - name: Report closure size
        run: nix path-info -Sh .#nixosConfigurations.nixos.config.system.build.toplevel
