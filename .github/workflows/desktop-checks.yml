name: Desktop configuration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Resolve and check the committed lock
        run: |
          nix flake lock
          echo '::group::Resolved flake.lock'
          cat flake.lock
          echo '::endgroup::'
          git diff --exit-code -- flake.lock
      - name: Python regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Nix evaluation
        run: |
          nix flake check --no-build
          nix eval --raw .#nixosConfigurations.nixos.config.system.build.toplevel.drvPath
      - name: Hyprland Lua validation (real pinned compositor)
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.desktop-config
      - name: Desktop helpers and xremap profile validation
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.desktop-tools
