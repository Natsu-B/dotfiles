name: Desktop configuration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            keep-outputs = false
            keep-derivations = false
      - name: Resolve and check the committed lock
        run: |
          nix flake lock
          echo '::group::Resolved flake.lock'
          cat flake.lock
          echo '::endgroup::'
          git diff --exit-code -- flake.lock
      - name: Shell syntax
        run: |
          sh -n install.sh update.sh scripts/check-boot-filesystems.sh
          bash -n installer/prepare-windows-dualboot.sh scripts/vivado.sh scripts/cfu-make.sh
      - name: Python regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Nix evaluation
        run: |
          nix flake check --no-build
          nix eval --raw .#nixosConfigurations.nixos.config.system.build.toplevel.drvPath
          test "$(nix eval --raw .#nixosConfigurations.nixos.config.networking.hostName)" = nixos
          nix eval --raw .#nixosConfigurations.nixos-windows.config.system.build.toplevel.drvPath
          test "$(nix eval --raw .#nixosConfigurations.nixos-windows.config.networking.hostName)" = nixos
          test "$(nix eval --raw .#nixosConfigurations.nixos-windows.config.boot.loader.efi.efiSysMountPoint)" = /efi
          test "$(nix eval --raw .#nixosConfigurations.nixos-windows.config.boot.loader.systemd-boot.xbootldrMountPoint)" = /boot
      - name: Security version guard (no build)
        shell: bash
        run: |
          set -euo pipefail
          report="$(nix eval --impure --json --expr '
            let
              flake = builtins.getFlake (toString ./.);
              stable = flake.inputs.nixpkgs.legacyPackages."x86_64-linux";
              unstable = flake.inputs.nixpkgs-unstable.legacyPackages."x86_64-linux";
              master = flake.inputs.nixpkgs-master.legacyPackages."x86_64-linux";
              packages = flake.nixosConfigurations.nixos.config.home-manager.users.hotaru.home.packages;
              ankiMatches = builtins.filter (p: (p.pname or "") == "anki") packages;
              ankiVersion =
                if builtins.length ankiMatches == 1 then
                  (builtins.head ankiMatches).version
                else
                  "";
              desktopApps = builtins.filter (p:
                builtins.elem (p.pname or "") [ "codex-desktop" "claude-desktop" ]
              ) packages;
              # Inspect the actual direct derivation inputs, not a descriptive passthru flag.
              securedDesktopApps = builtins.length desktopApps == 2
                && builtins.all (p:
                  let
                    directExpat = builtins.filter (dep:
                      (dep.pname or "") == "expat"
                    ) (p.buildInputs or []);
                  in
                    builtins.length directExpat == 1
                    && (builtins.head directExpat).version == "2.10.0"
                ) desktopApps;
            in {
              inherit ankiVersion securedDesktopApps;
              ankiMeetsSecurityFloor =
                builtins.length ankiMatches == 1
                && builtins.compareVersions ankiVersion "26.9" >= 0;
              stable = {
                brotli = stable.brotli.version;
                expat = stable.expat.version;
                glibNetworking = stable."glib-networking".version;
              };
              unstable = {
                brotli = unstable.brotli.version;
                expat = unstable.expat.version;
                glibNetworking = unstable."glib-networking".version;
              };
              master = {
                brotli = master.brotli.version;
                expat = master.expat.version;
                glibNetworking = master."glib-networking".version;
              };
            }
          ')"
          printf '%s\n' "$report" | jq .
          if ! jq -e '.ankiMeetsSecurityFloor == true' <<<"$report" >/dev/null; then
            echo "::error::Reject Anki older than 26.9 (GHSA-932p-crhj-v43p and GHSA-jw6j-j4mf-8jgm)"
            exit 1
          fi
          if ! jq -e '.securedDesktopApps == true' <<<"$report" >/dev/null; then
            echo "::error::Both desktop apps must use the patched Expat 2.10.0 runtime input."
            exit 1
          fi
          echo "Package versions are informational; check runtime closures and bundled libraries separately."
      - name: Validate production boot layout and compatibility alias
        run: |
          test "$(nix eval --raw .#nixosConfigurations.nixos.config.boot.loader.efi.efiSysMountPoint)" = /efi
          test "$(nix eval --raw .#nixosConfigurations.nixos.config.boot.loader.systemd-boot.xbootldrMountPoint)" = /boot
          test "$(nix eval --raw .#nixosConfigurations.nixos.config.system.build.toplevel.drvPath)" = \
            "$(nix eval --raw .#nixosConfigurations.nixos-windows.config.system.build.toplevel.drvPath)"
      - name: Keyboard device access policy
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.keyboard-access
      - name: Hibernate policy
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.hibernate-policy
      - name: Guard against unexpectedly large rebuilds
        shell: bash
        run: |
          set -euo pipefail
          plan="$(nix build --dry-run --no-link .#checks.x86_64-linux.desktop-entries 2>&1)"
          printf '%s\n' "$plan"
          # Nix omits the "will be built" heading if all outputs are cached.
          count="$(printf '%s\n' "$plan" | sed -nE 's/^these ([0-9]+) derivations will be built:.*/\1/p' | head -n 1)"
          count="${count:-0}"
          if (( count > 100 )); then
            echo "Refusing to compile $count derivations; investigate cache/replacement scope" >&2
            exit 1
          fi
      - name: Build and validate Home Manager desktop entries
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.desktop-entries
      - name: Hyprland Lua validation (real pinned compositor)
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.desktop-config
      - name: Desktop helpers and xremap profile validation
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.desktop-tools
      - name: Guard against mass NixOS rebuilds
        shell: bash
        run: |
          set -euo pipefail
          plan="$(nix build --dry-run --no-link .#nixosConfigurations.nixos.config.system.build.toplevel 2>&1)"
          printf '%s\n' "$plan"
          count="$(printf '%s\n' "$plan" | sed -nE 's/^these ([0-9]+) derivations will be built:.*/\1/p' | head -n 1)"
          if [[ -z "$count" ]] && grep -q 'this derivation will be built:' <<<"$plan"; then
            count=1
          fi
          if [[ -z "$count" ]]; then count=0; fi
          # Successful baseline #14: 561 builds in roughly 52 minutes.
          # Count is a coarse CI guard, not an execution-time guarantee.
          if (( count > 600 )); then
            echo "::error::Planned NixOS builds: $count (>600). Do not merge without investigating the cache."
            exit 1
          fi
  # The regular checks need only ~10 minutes, but the NixOS toplevel
  # compiles uncached cross-compilers and Python packages on hosted runners.
  # Keep the full build mandatory, isolated, and bounded instead of skipping it.
  full-system-build:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            keep-outputs = false
            keep-derivations = false
      - name: Reject mass NixOS rebuilds
        shell: bash
        run: |
          set -euo pipefail
          plan="$(nix build --dry-run --no-link .#nixosConfigurations.nixos.config.system.build.toplevel 2>&1)"
          printf '%s\n' "$plan"
          count="$(printf '%s\n' "$plan" | sed -nE 's/^these ([0-9]+) derivations will be built:.*/\1/p' | head -n 1)"
          if [[ -z "$count" ]] && grep -q 'this derivation will be built:' <<<"$plan"; then count=1; fi
          count="${count:-0}"
          if (( count > 600 )); then
            echo "::error::Planned NixOS builds: $count (>600). Investigate cache and dependencies." >&2
            exit 1
          fi
      - name: Build complete NixOS system
        run: nix build --no-link --print-build-logs .#nixosConfigurations.nixos.config.system.build.toplevel
      - name: Report system closure size
        run: nix path-info -Sh .#nixosConfigurations.nixos.config.system.build.toplevel

  # Nix evaluation alone does not show what a repackaged Electron binary loads.
  # Build both applications and collect ELF/closure evidence as a required check.
  desktop-app-builds:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build patched desktop apps and inspect ELF dependencies
        shell: bash
        run: |
          set -euo pipefail
          for name in codex-desktop claude-desktop; do
            export TARGET_DESKTOP="$name"
            out="$(nix build --no-link --print-out-paths --print-build-logs --impure --expr '
              let
                flake = builtins.getFlake (toString ./.);
                apps = builtins.filter (p:
                  (p.pname or "") == builtins.getEnv "TARGET_DESKTOP"
                ) flake.nixosConfigurations.nixos.config.home-manager.users.hotaru.home.packages;
              in
                assert builtins.length apps == 1;
                builtins.head apps
            ')"
            test -x "$out/bin/$name"
            expected="$(nix eval --impure --raw --expr '
              let
                flake = builtins.getFlake (toString ./.);
                packages = flake.nixosConfigurations.nixos.config.home-manager.users.hotaru.home.packages;
                apps = builtins.filter (p: (p.pname or "") == builtins.getEnv "TARGET_DESKTOP") packages;
                expats = if builtins.length apps == 1
                  then builtins.filter (p: (p.pname or "") == "expat") ((builtins.head apps).buildInputs or [])
                  else [];
              in
                assert builtins.length expats == 1;
                assert (builtins.head expats).version == "2.10.0";
                toString ((builtins.head expats).out)
            ')"
            echo "::group::$name runtime closure"
            nix-store --query --requisites "$out" | grep -E '(expat|libexpat)' || true
            echo "::endgroup::"
            echo "::group::$name direct ELF Expat dependencies and runpaths"
            linked=0
            while IFS= read -r -d '' file; do
              dynamic="$(readelf -d "$file" 2>/dev/null || true)"
              if grep -q 'Shared library: \[libexpat\.so\.1\]' <<<"$dynamic"; then
                linked=$((linked + 1))
                printf 'ELF: %s\n' "$file"
                printf '%s\n' "$dynamic" | grep -E 'NEEDED|RPATH|RUNPATH' || true
                runpath="$(printf '%s\n' "$dynamic" | sed -nE 's/^.*Library (runpath|rpath): \[([^]]*)\].*$/\2/p' | head -n 1)"
                if [[ -z "$runpath" ]]; then
                  echo "::error::Missing ELF runpath for $file" >&2
                  exit 1
                fi
                resolved=""
                IFS=':' read -ra entries <<<"$runpath"
                for entry in "${entries[@]}"; do
                  origin="$(dirname "$file")"
                  entry="${entry//\$ORIGIN/$origin}"
                  if [[ -e "$entry/libexpat.so.1" ]]; then
                    resolved="$entry"
                    break
                  fi
                done
                if [[ "$resolved" != "$expected/lib" ]]; then
                  echo "::error::$file resolves libexpat.so.1 from $resolved, expected $expected/lib" >&2
                  exit 1
                fi
              fi
            done < <(find "$out" -type f -print0)
            if (( linked == 0 )); then
              echo "::error::No directly linked libexpat.so.1 found in $name" >&2
              exit 1
            fi
            echo "::endgroup::"
          done
          echo "Checked direct ELF runpath selection; bundled static/dlopen libraries still require separate review."
