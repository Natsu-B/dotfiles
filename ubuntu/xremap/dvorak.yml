{
  "virtual_modifiers": [
    "F15",
    "F14"
  ],
  "modmap": [
    {
      "name": "Japanese input",
      "remap": {
        "CapsLock": "CODE_93",
        "GRAVE": "CODE_93",
        "MUHENKAN": "F15",
        "HENKAN": "F14"
      }
    },
    {
      "name": "SandS",
      "remap": {
        "Space": {
          "held": "Shift_L",
          "alone": "Space",
          "alone_timeout_millis": 999999999999
        }
      }
    }
  ],
  "keymap": [
    {
      "name": "Muhenkan navigation and Eisu",
      "remap": {
        "F15-J": "Left",
        "F15-L": "Right",
        "F15-I": "Up",
        "F15-K": "Down",
        "F15-SEMICOLON": "Enter",
        "F15-O": "Delete",
        "F15-P": "Backspace",
        "F15-H": "Tab",
        "F15-U": "CODE_93",
        "F15-M": "MUHENKAN",
        "F15-1": "1",
        "F15-2": "2",
        "F15-3": "3",
        "F15-4": "4",
        "F15-5": "5",
        "F15-6": "6",
        "F15-7": "7",
        "F15-8": "8",
        "F15-9": "9",
        "F15-0": "0"
      }
    },
    {
      "name": "Henkan Kana",
      "remap": {
        "F14-COMMA": "HENKAN"
      }
    },
    {
      "name": "Programmer Dvorak typing only",
      "exact_match": true,
      "remap": {
        "1": "Shift-6",
        "Shift-1": "1",
        "2": "RIGHTBRACE",
        "Shift-2": "2",
        "3": "Shift-RIGHTBRACE",
        "Shift-3": "3",
        "4": "Shift-BACKSLASH",
        "Shift-4": "4",
        "5": "Shift-8",
