        "Shift-6": "6",
        "7": "Shift-APOSTROPHE",
        "Shift-7": "7",
        "8": "Shift-9",
        "Shift-8": "8",
        "9": "Shift-SEMICOLON",
        "Shift-9": "9",
        "0": "BACKSLASH",
        "Shift-0": "0",
        "MINUS": "Shift-1",
        "Shift-MINUS": "Shift-5",
        "EQUAL": "Shift-3",
        "Shift-EQUAL": "Shift-LEFTBRACE",
        "Q": "SEMICOLON",
        "Shift-Q": "APOSTROPHE",
        "W": "COMMA",
        "Shift-W": "Shift-COMMA",
        "E": "DOT",
