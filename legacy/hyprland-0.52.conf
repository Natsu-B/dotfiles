# The pinned nixpkgs release uses Hyprlang. Upgrade the OS/config format separately.
# XKB stays JIS/QWERTY; xremap owns the custom Dvorak layer.
source = ~/.config/hypr/commands.conf
monitor = , preferred, auto, 1

input {
    kb_layout = jp
    kb_variant =
    kb_options =
    resolve_binds_by_sym = 0
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
}
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(cba6f7ff) rgba(89b4faff) 45deg
    col.inactive_border = rgba(45475aaa)
    layout = dwindle
}
decoration {
    rounding = 14
    blur {
        enabled = true
        size = 8
        passes = 2
    }
    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00000055)
    }
}
animations {
    enabled = true
    bezier = smooth, 0.16, 1, 0.3, 1
    animation = windows, 1, 3, smooth
    animation = fade, 1, 3, smooth
    animation = workspaces, 1, 3, smooth
}
dwindle {
    pseudotile = true
    preserve_split = true
}
misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

# Modifiers bypass the Dvorak typing layer; codes refer to physical JIS keys.
bindd = SUPER, space, Applications and actions, exec, $launcher
bindd = SUPER, code:40, Applications and actions (SandS fallback), exec, $launcher
bindd = SUPER, F1, Shortcut cheat sheet, exec, $cheatsheet
bindrd = SUPER, F2, Toggle QWERTY and custom Dvorak, exec, $keyboard
bindd = SUPER, code:55, Clipboard history (copy selection then Ctrl+V), exec, $clipboard
bindd = SUPER SHIFT, code:55, Pause or resume clipboard recording, exec, $clipboardPrivacy
bindd = SUPER CTRL, code:55, Clear clipboard history and current clipboard, exec, $clipboardClear
bindd = SUPER, Return, Terminal, exec, $terminal
bindd = SUPER, code:26, File manager, exec, $fileManager
bindd = SUPER, code:46, Lock screen and clear clipboard history, exec, $lock
bindd = SUPER SHIFT, code:24, Close focused window, killactive,
bindd = SUPER, code:41, Fullscreen, fullscreen,
bindd = SUPER SHIFT, space, Toggle floating, togglefloating,
bindd = SUPER SHIFT, code:58, Log out to GDM, exec, $logout
bindd = SUPER, Left, Focus left, movefocus, l
bindd = SUPER, Right, Focus right, movefocus, r
bindd = SUPER, Up, Focus up, movefocus, u
bindd = SUPER, Down, Focus down, movefocus, d
bindd = SUPER SHIFT, Left, Move window left, movewindow, l
bindd = SUPER SHIFT, Right, Move window right, movewindow, r
bindd = SUPER SHIFT, Up, Move window up, movewindow, u
bindd = SUPER SHIFT, Down, Move window down, movewindow, d
bindd = SUPER, code:10, Workspace 1, workspace, 1
bindd = SUPER, code:11, Workspace 2, workspace, 2
bindd = SUPER, code:12, Workspace 3, workspace, 3
bindd = SUPER, code:13, Workspace 4, workspace, 4
bindd = SUPER, code:14, Workspace 5, workspace, 5
bindd = SUPER, code:15, Workspace 6, workspace, 6
bindd = SUPER, code:16, Workspace 7, workspace, 7
bindd = SUPER, code:17, Workspace 8, workspace, 8
bindd = SUPER, code:18, Workspace 9, workspace, 9
bindd = SUPER, code:19, Workspace 10, workspace, 10
bindd = SUPER SHIFT, code:10, Send to workspace 1, movetoworkspace, 1
bindd = SUPER SHIFT, code:11, Send to workspace 2, movetoworkspace, 2
bindd = SUPER SHIFT, code:12, Send to workspace 3, movetoworkspace, 3
bindd = SUPER SHIFT, code:13, Send to workspace 4, movetoworkspace, 4
bindd = SUPER SHIFT, code:14, Send to workspace 5, movetoworkspace, 5
bindd = SUPER SHIFT, code:15, Send to workspace 6, movetoworkspace, 6
bindd = SUPER SHIFT, code:16, Send to workspace 7, movetoworkspace, 7
bindd = SUPER SHIFT, code:17, Send to workspace 8, movetoworkspace, 8
bindd = SUPER SHIFT, code:18, Send to workspace 9, movetoworkspace, 9
bindd = SUPER SHIFT, code:19, Send to workspace 10, movetoworkspace, 10
bindmd = SUPER, mouse:272, Drag window, movewindow
bindmd = SUPER, mouse:273, Resize window, resizewindow
bindeld = , XF86AudioRaiseVolume, Increase volume, exec, $volume set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindeld = , XF86AudioLowerVolume, Decrease volume, exec, $volume set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindld = , XF86AudioMute, Mute audio, exec, $volume set-mute @DEFAULT_AUDIO_SINK@ toggle
bindeld = , XF86MonBrightnessUp, Increase brightness, exec, $brightness set +5%
bindeld = , XF86MonBrightnessDown, Decrease brightness, exec, $brightness set 5%-
# UWSM and systemd start the daemons. Do not add duplicate exec-once launches.
